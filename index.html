<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mezzanine</title>
<meta name="description" content="A place for weird little things on the internet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ece4d3;
    --paper-2: #e2d9c4;
    --ink: #1f1d1a;
    --ink-2: #4a4640;
    --ink-3: #8a8478;
    --primary: #c84a2c;
    --secondary: #3b6b6e;
    --accent: #d9a23d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* top bar — kept minimal, just signals aliveness */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-2);
    padding: 14px 28px;
    border-bottom: 1.5px solid var(--ink);
    letter-spacing: 0.02em;
  }
  .topbar .live-dot {
    width: 7px;
    height: 7px;
    background: var(--primary);
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .topbar .right {
    color: var(--ink-3);
  }

  /* main area — centered */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  .center {
    text-align: center;
    max-width: 640px;
  }
  .wordmark {
    font-family: 'VT323', monospace;
    font-size: 132px;
    line-height: 0.88;
    color: var(--ink);
    letter-spacing: 0.015em;
    margin-bottom: 4px;
  }
  .wordmark .gg {
    font-size: 52px;
    color: var(--primary);
    margin-left: 8px;
    vertical-align: 28px;
  }
  .tagline {
    font-family: 'Newsreader', serif;
    font-size: 26px;
    font-style: italic;
    font-weight: 400;
    color: var(--ink-2);
    line-height: 1.35;
    margin-bottom: 8px;
  }
  .tagline .highlight {
    color: var(--ink);
    font-style: normal;
    font-weight: 500;
    background: linear-gradient(transparent 62%, var(--accent) 62%, var(--accent) 92%, transparent 92%);
    padding: 0 2px;
  }
  .soon {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--ink-3);
    display: inline-block;
  }
  .soon-line {
    display: flex;
    justify-content: center;
    margin-top: 32px;
  }

  /* footer */
  .footer {
    padding: 14px 28px;
    border-top: 1.5px solid var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer a {
    color: var(--ink-2);
    text-decoration: none;
  }
  .footer a:hover { color: var(--ink); }

  @media (max-width: 600px) {
    .wordmark { font-size: 88px; }
    .wordmark .gg { font-size: 36px; vertical-align: 18px; }
    .tagline { font-size: 20px; }
    .topbar { padding: 12px 16px; font-size: 10px; }
    .footer { padding: 12px 16px; font-size: 10px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <span><span class="live-dot"></span>Under construction</span>
    <span class="right">mezzanine.gg</span>
  </div>

  <main>
    <div class="center">
      <h1 class="wordmark">mezzanine<span class="gg">.gg</span></h1>
      <p class="tagline">A place for <span class="highlight">weird little things</span> on the internet.</p>
      <div class="soon-line">
        <span class="soon">Coming Soon</span>
      </div>
    </div>
  </main>

  <div class="footer">
    <span>Made by hand · Run by humans</span>
    <span><a href="mailto:hello@mezzanine.gg">hello@mezzanine.gg</a></span>
  </div>

</body>
</html>
